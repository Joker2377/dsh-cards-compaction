name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # No dependency install: the suite imports only node: builtins and lib/.
      - name: Manifest, locale and syntax
        run: node scripts/check.mjs
      - name: Tests
        run: npm test
      # Shared rules live in dsh-plugin-devkit's doctor. Pinned to a full commit
      # (v0.5.0): the content cannot move, and CI needs neither the npm registry
      # nor a release to exist. Bump it deliberately; a floating spec would change
      # CI without a commit.
      - name: Doctor
        run: |
          npm i --no-save --prefix "$RUNNER_TEMP/devkit" \
            "https://codeload.github.com/Joker2377/dsh-plugin-devkit/tar.gz/5fe794632bd5e2637c27f5ddf5642aeb2f1cd659"
          node "$RUNNER_TEMP/devkit/node_modules/dsh-plugin-devkit/scripts/cli.mjs" doctor .
