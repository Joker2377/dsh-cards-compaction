# dsh-cards-compaction — background history cards, one verified checkpoint at compaction time.
#
# One compaction owner per profile: this patch disables the built-in
# compaction-basic row (dsh-base) and inserts this bundle. Removing the bundle
# removes this patch, so compaction-basic comes back on its own.
# /compact (command-compact) follows whichever ctx.compaction is mounted.
- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  disabled: true

- insert:
    - id: cards-compaction
      name: dsh-cards-compaction
